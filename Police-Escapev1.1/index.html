<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>Police Escape</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- =========================================
       HAUPTMENÜ
       ========================================= -->

  <section id="menu" class="screen active">

    <div class="logo">
      POLICE<br>
      <span>ESCAPE</span>
    </div>

    <p class="subtitle">
      Endless Arcade Chase
    </p>

    <div class="money">
      Geld: $<span class="moneyValue">0</span>
    </div>

    <div class="highscoreMenu">
      Highscore:
      <b id="menuHighscore">0</b>
    </div>

    <div class="setting">

      <label for="densitySelect">
        Verkehrsdichte
      </label>

      <select id="densitySelect">

        <option value="low">
          Wenig Verkehr
        </option>

        <option value="normal">
          Normaler Verkehr
        </option>

        <option value="high">
          Dichter Verkehr
        </option>

      </select>

    </div>

    <div class="setting">

      <label for="languageSelect">
        Sprache
      </label>

      <select id="languageSelect">

        <option value="de">
          Deutsch
        </option>

        <option value="en">
          English
        </option>

        <option value="es">
          Español
        </option>

      </select>

    </div>

    <button data-action="play">
      SPIELEN
    </button>

    <button data-action="cars">
      AUTOS
    </button>

    <button data-action="roads">
      STRASSEN
    </button>

    <div class="ad-container">
      <!--
        Hier kannst du später deinen AdSense-Code einsetzen.
      -->
    </div>

  </section>


  <!-- =========================================
       AUTOS
       ========================================= -->

  <section id="cars" class="screen">

    <div class="money">
      Geld: $<span class="moneyValue">0</span>
    </div>

    <div id="carItems" class="cards"></div>

    <button data-action="menu">
      ZURÜCK
    </button>

  </section>


  <!-- =========================================
       STRASSEN
       ========================================= -->

  <section id="roads" class="screen">

    <div class="money">
      Geld: $<span class="moneyValue">0</span>
    </div>

    <div id="roadItems" class="cards"></div>

    <button data-action="menu">
      ZURÜCK
    </button>

  </section>


  <!-- =========================================
       GAME
       ========================================= -->

  <section id="game" class="screen gameScreen">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

      <div>
        <span id="scoreLabel">
          Score:
        </span>

        <b id="score">0</b>
      </div>

      <div>
        <span id="distanceLabel">
          Distanz:
        </span>

        <b id="distance">0.0 km</b>
      </div>

      <div>
        <span id="livesLabel">
          Leben:
        </span>

        <b id="lives">♥ ♥ ♥</b>
      </div>

    </div>


    <!-- HIGH / WANTED -->

    <div id="policeStatus">

      <span id="policeLabel">
        POLIZEI:
      </span>

      <span id="policeDistance">
        weit entfernt
      </span>

    </div>


    <!-- NITRO -->

    <div id="nitroHud">

      <div class="nitroTitle">
        <span id="nitroLabel">NITRO</span>

        <span id="nitroPercent">
          100%
        </span>
      </div>

      <div class="nitroBar">
        <div id="nitroFill"></div>
      </div>

    </div>


    <!-- PAUSE -->

    <button id="pauseBtn">
      Ⅱ
    </button>


    <!-- TOUCH CONTROLS -->

    <div id="touchControls">

      <button
        data-key="left"
        aria-label="Nach links lenken">
        ‹
      </button>

      <button
        id="boostBtn"
        data-key="boost"
        aria-label="Nitro aktivieren">
        ⚡
      </button>

      <button
        data-key="right"
        aria-label="Nach rechts lenken">
        ›
      </button>

    </div>


    <!-- PAUSE OVERLAY -->

    <div id="pauseOverlay" class="overlay">

      <h1 id="pauseTitle">
        PAUSE
      </h1>

      <button data-action="resume">
        WEITER
      </button>

      <button data-action="quit">
        BEENDEN
      </button>

    </div>

  </section>


  <!-- =========================================
       GAME OVER
       ========================================= -->

  <section id="gameover" class="screen">

    <h1 id="gameoverTitle">
      GAME OVER
    </h1>

    <p class="bigScore">

      <span id="finalScoreLabel">
        Score:
      </span>

      <b id="finalScore">
        0
      </b>

    </p>

    <p>

      <span id="drivenLabel">
        Gefahrene Strecke:
      </span>

      <b id="finalDistance">
        0.0 km
      </b>

    </p>

    <p>

      <span id="earnedLabel">
        Verdient:
      </span>

      <b id="earnedMoney">
        $0
      </b>

    </p>

    <p>

      <span id="highscoreResultLabel">
        Highscore:
      </span>

      <b id="finalHighscore">
        0
      </b>

    </p>

    <button data-action="play">
      NOCHMAL SPIELEN
    </button>

    <button data-action="menu">
      HAUPTMENÜ
    </button>

  </section>

</main>

<!-- =========================================
     CODE FENSTER
     ========================================= -->

<div
  id="codeOverlay"
  class="overlay"
  aria-hidden="true"
>

  <div
    class="codeBox"
    role="dialog"
    aria-modal="true"
    aria-labelledby="codeTitle"
  >

    <h1 id="codeTitle">
      CODE
    </h1>

    <p id="codeMessage">
      Gib deinen Code ein.
    </p>

    <input
      id="codeInput"
      type="text"
      maxlength="30"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="CODE EINGEBEN"
    >

    <button
      id="redeemCodeBtn"
      type="button"
    >
      EINLÖSEN
    </button>

    <button
      id="closeCodeBtn"
      class="secondary"
      type="button"
    >
      SCHLIESSEN
    </button>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
