<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Police Escape</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="menu" class="screen active">
      <div class="logo">POLICE<br><span>ESCAPE</span></div>
      <p class="subtitle">Endless Arcade Chase</p>
      <div class="money">Geld: $<span class="moneyValue">0</span></div>

      <div class="setting">
        <label for="densitySelect">Verkehrsdichte</label>
        <select id="densitySelect">
          <option value="low">Wenig Verkehr</option>
          <option value="normal">Normaler Verkehr</option>
          <option value="high">Dichter Verkehr</option>
        </select>
      </div>
      
      <div class="setting">
        <label for="languageSelect">Sprache</label>
        <select id="languageSelect">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>

      <button data-action="play">SPIELEN</button>
      <button data-action="cars">AUTOS</button>
      <button data-action="roads">STRASSEN</button>
    </section>

    <section id="cars" class="screen">
      <div class="money">Geld: $<span class="moneyValue">0</span></div>
      <div id="carItems" class="cards"></div>
      <button data-action="menu">ZURÜCK</button>
    </section>

    <section id="roads" class="screen">
      <div class="money">Geld: $<span class="moneyValue">0</span></div>
      <div id="roadItems" class="cards"></div>
      <button data-action="menu">ZURÜCK</button>
    </section>

    <section id="game" class="screen gameScreen">
      <canvas id="canvas"></canvas>

    <div id="hud">
      <div>
        <span id="scoreLabel">Score:</span>
        <b id="score">0</b>
      </div>

      <div>
        <span id="distanceLabel">Distanz:</span>
        <b id="distance">0.0 km</b>
      </div>

      <div>
        <span id="livesLabel">Leben:</span>
        <b id="lives">♥ ♥ ♥</b>
      </div>
    </div>

    <div id="policeStatus">
      <span id="policeLabel">POLIZEI:</span>
      <span id="policeDistance">weit entfernt</span>
    </div>

      <button id="pauseBtn">Ⅱ</button>

      <div id="touchControls">
        <button data-key="left" aria-label="Nach links lenken">‹</button>
        <button data-key="right" aria-label="Nach rechts lenken">›</button>
      </div>

      <div id="pauseOverlay" class="overlay">
        <h1>PAUSE</h1>
        <button data-action="resume">WEITER</button>
        <button data-action="quit">BEENDEN</button>
      </div>
    </section>

    <section id="gameover" class="screen">

      <h1 id="gameoverTitle">GAME OVER</h1>

      <p class="bigScore">
        <span id="finalScoreLabel">Score:</span>
        <b id="finalScore">0</b>
      </p>

      <p>
        <span id="drivenLabel">Gefahrene Strecke:</span>
        <b id="finalDistance">0.0 km</b>
      </p>

      <p>
        <span id="earnedLabel">Verdient:</span>
        <b id="earnedMoney">$0</b>
      </p>

      <button data-action="play">NOCHMAL SPIELEN</button>
      <button data-action="menu">HAUPTMENÜ</button>

    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
